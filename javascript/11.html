<!DOCTYPE html>
<html>
<head>
  <title>Fruits Array</title>
</head>
<body>
  <h1>Check the Console for Output</h1>

  <script>
    // Declare the array
    let fruits = ["apple", "banana", "cherry"];

    // Add a fruit to the end
    fruits.push("orange");

    // Remove the first fruit
    fruits.shift();

    // Log the modified array
    console.log("Modified fruits array:", fruits);
  </script>
</body>
</html>
