<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Operations</title>
</head>
<body>
    <h1>Open the Console to See the Output</h1>

    <script>
        // Declare two numbers
        let a = 15;
        let b = 5;

        // Arithmetic operations
        console.log("Addition (a + b):", a + b);
        console.log("Subtraction (a - b):", a - b);
        console.log("Multiplication (a * b):", a * b);
        console.log("Division (a / b):", a / b);

        // Comparison operations
        console.log("Are a and b equal (a === b)?", a === b);
        console.log("Is a greater than b (a > b)?", a > b);

        // Logical operations
        console.log("Is a > 10 AND b < 10?", a > 10 && b < 10);
        console.log("Is a > 20 OR b < 10?", a > 20 || b < 10);
        console.log("NOT (a > b):", !(a > b));
    </script>
</body>
</html>
