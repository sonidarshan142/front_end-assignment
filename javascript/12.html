<!DOCTYPE html>
<html>
<head>
  <title>Sum of Array Elements</title>
</head>
<body>
  <h1>Sum of Array Elements</h1>

  <p id="result"></p>

  <script>
    // Define an array of numbers
    let numbers = [5, 10, 15, 20, 25];

    // Calculate the sum
    let sum = 0;
    for (let i = 0; i < numbers.length; i++) {
      sum += numbers[i];
    }

    // Display the result
    document.getElementById("result").innerText = "Sum of array elements: " + sum;
  </script>
</body>
</html>
