<!DOCTYPE html>
<html>
<head>
  <title>Do-While Loop Input</title>
</head>
<body>
  <h1>Enter a Number Greater Than 10</h1>

  <script>
    let number;

    do {
      number = parseInt(prompt("Please enter a number greater than 10:"));
    } while (number <= 10 || isNaN(number));

    alert("Thank you! You entered: " + number);
  </script>
</body>
</html>
