<!DOCTYPE html>
<html>
<head>
  <title>Button Click Alert</title>
</head>
<body>
  <h1>Click the Button</h1>
  <button id="myButton"><Button></Button></button>

  <script>
    const button = document.getElementById("myButton");

    // Add event listener
    button.addEventListener("click", function() {
      alert("Button clicked!");
    });
  </script>
</body>
</html>
